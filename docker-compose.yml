# Sobe um MySQL 8 e aplica a modelagem inteira, na ordem, com um comando:
#
#   docker compose up -d
#   docker compose logs -f db     # acompanhe até "ready for connections"
#
# Os scripts de sql_implementation/ são montados no diretório de inicialização
# do container e executados em ordem alfabética na primeira subida — é por isso
# que os arquivos são numerados.
#
# Conectar:  mysql -h 127.0.0.1 -P 3306 -u root -proot ecommerce

services:
  db:
    image: mysql:8.4
    container_name: ecommerce_mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # O seed de 100 mil pedidos cabe folgado aqui; com o padrão de 128 MB o
      # benchmark mediria disco em vez de plano de execução.
      - --innodb-buffer-pool-size=512M
      - --local-infile=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ecommerce
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql_implementation:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  mysql_data:
